<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">

  <rect x="0" y="0" width="700" height="360" fill="#f1efe3"/>
  <rect x="0" y="0" width="700" height="360" fill="none" stroke="#ccc" stroke-width="1"/>

  <!-- título -->
  <text x="350" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#1a5c3a" font-weight="bold">Eletroquímica</text>
  <text x="350" y="64" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#666">Experimento com pilha e limão</text>

  <!-- bancada -->
  <rect x="0" y="300" width="700" height="60" fill="#e7e3d3"/>
  <line x1="0" y1="300" x2="700" y2="300" stroke="#cfcabb" stroke-width="2"/>

  <!-- multímetro -->
  <g transform="translate(300,120)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#f2c14e" stroke="#c79a2e" stroke-width="2"/>
    <rect x="10" y="10" width="55" height="26" fill="#dfe8dd" stroke="#9fae9c" stroke-width="1.5"/>
    <circle cx="80" cy="42" r="14" fill="#f6d787" stroke="#c79a2e" stroke-width="1.5"/>
    <line x1="72" y1="34" x2="88" y2="50" stroke="#8a6a1f" stroke-width="2"/>
  </g>

  <!-- fios -->
  <path d="M330,190 L330,235 L230,235 L230,255" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <path d="M370,190 L370,235 L440,235 L440,255" fill="none" stroke="#3a3a3a" stroke-width="3"/>

  <!-- limão -->
  <ellipse cx="335" cy="270" rx="110" ry="65" fill="#d7d24a" stroke="#a9a52f" stroke-width="2"/>
  <ellipse cx="300" cy="245" rx="35" ry="16" fill="#e6e277" opacity="0.6"/>

  <!-- eletrodo zinco -->
  <rect x="222" y="245" width="14" height="70" rx="2" fill="#b9c6c2" stroke="#7f9490" stroke-width="1.5"/>

  <!-- eletrodo cobre -->
  <rect x="432" y="245" width="14" height="70" rx="2" fill="#cc7a44" stroke="#8a5230" stroke-width="1.5"/>

  <!-- elétrons (pontinhos indicando fluxo) -->
  <circle cx="260" cy="235" r="4" fill="#1a5c3a"/>
  <circle cx="300" cy="235" r="4" fill="#1a5c3a"/>
  <circle cx="400" cy="235" r="4" fill="#1a5c3a"/>
  <circle cx="410" cy="235" r="4" fill="#1a5c3a"/>

</svg>
